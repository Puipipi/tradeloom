{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>织贸企业服务登录</title><link rel="stylesheet" href="{% static 'enterprise_portal/console.css' %}"><link rel="stylesheet" href="{% static 'enterprise_portal/portal.css' %}"></head>
<body class="portal portal-login">
  <main class="login-panel">
    <h1>织贸企业服务</h1>
    {% if login_error %}<p class="login-error" role="alert">{{ login_error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {% if email_step %}<p>验证码已发送至管理员绑定的邮箱，5 分钟内有效。</p><input type="hidden" name="action" value="verify"><label for="email-code">邮箱验证码</label><input id="email-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>{% else %}{{ form.as_p }}{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="primary" type="submit">{% if email_step %}验证并登录{% else %}登录{% endif %}</button>
    </form>
    {% if email_step %}<form method="post">{% csrf_token %}<button name="action" value="resend">重新发送验证码</button><button name="action" value="restart">返回账号密码</button></form>{% endif %}
  </main>
</body>
</html>
