name: RC21 hosted Windows SSH group QA

on:
  push:
    branches:
      - qa/enterprise-ssh-rc21-hosted
    paths:
      - .github/workflows/rc21-ssh-hosted-qa.yml
      - scripts/qa/rc21-ssh-hosted-qa.ps1
      - Manage-SshAccess.ps1
      - scripts/Manage-SshAccess.ps1
      - scripts/LocalSshGroupManagement.ps1
      - scripts/inspect-ssh-group-policy.py

permissions:
  contents: read

concurrency:
  group: rc21-hosted-ssh-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-ssh-group:
    name: Windows Server 2025 SSH group grant and revoke
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the QA branch without a persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify the published RC21 server package and test SSH group access
        shell: powershell
        timeout-minutes: 25
        run: .\scripts\qa\rc21-ssh-hosted-qa.ps1
