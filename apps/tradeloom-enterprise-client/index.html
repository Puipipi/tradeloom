<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>登录织贸 - TradeLoom</title>
  <style>
    body { margin: 0; padding: 28px; color: #e7edf5; background: #111820; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { color: #aebdcb; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; color: #aebdcb; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; color: inherit; background: #1c2732; border: 1px solid #46596b; border-radius: 6px; font: inherit; }
    button { margin-top: 14px; padding: 9px 16px; color: white; background: #3478c7; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <h1>登录织贸</h1>
  <p>使用企业提供的域名或公网 IP 和织贸内部账号登录。</p>
  <form id="connect-form">
    <div id="password-step"><label for="server-origin">域名或公网 IP</label>
    <input id="server-origin" type="text" autocomplete="off" spellcheck="false" placeholder="trade.example.com 或 203.0.113.10:8443" required>
    <label for="username">织贸内部账号</label>
    <input id="username" autocomplete="off" maxlength="150" required>
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="off" required>
    </div>
    <div id="email-step" hidden><p>验证码已发送至管理员绑定的邮箱，5 分钟内有效。</p><label for="email-code">邮箱验证码</label><input id="email-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button id="resend-code" type="button">重新发送验证码</button><button id="restart-login" type="button">返回账号密码</button></div>
    <button id="login-button" type="submit">登录</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="renderer.js"></script>
</body>
</html>
