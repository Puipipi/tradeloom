<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>登录织贸 - TradeLoom</title>
  <style>
    /* Same palette, type and controls as the accepted Personal portal/console. */
    :root { color-scheme:light; --bg:#f5f7fa; --panel:#fff; --hover:#eef1f6; --border:#d7dde7; --text:#1f2430; --dim:#667085; --accent:#2563eb; --on-accent:#fff; }
    @media (prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#0b0d12; --panel:#131722; --hover:#1a2030; --border:#232a3a; --text:#e6e8ee; --dim:#a5aec2; --accent:#4f8cff; --on-accent:#0b0d12; } }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
    main { max-width:448px; margin:0 auto; padding:24px; background:var(--panel); border:1px solid var(--border); border-radius:8px; }
    h1 { margin:0; font-size:24px; line-height:1.4; font-weight:600; }
    p { margin:8px 0 0; color:var(--dim); }
    header { margin-bottom:24px; }
    .fields { display:grid; gap:16px; }
    label { display:block; margin-bottom:6px; font-weight:500; }
    input { width:100%; min-height:40px; padding:8px 10px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px; font:inherit; }
    input::placeholder { color:var(--dim); opacity:1; }
    button { min-height:40px; padding:8px 12px; border:1px solid var(--border); border-radius:5px; background:var(--panel); color:var(--text); font:inherit; cursor:pointer; }
    button:not(:disabled):hover { background:var(--hover); }
    button:disabled { opacity:.55; cursor:default; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    #login-button { width:100%; margin-top:24px; background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
    #login-button:not(:disabled):hover { background:var(--accent); filter:brightness(.92); }
    #email-step>p { margin:0 0 20px; }
    #email-code { font-variant-numeric:tabular-nums; letter-spacing:.12em; }
    .secondary-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    .secondary-actions button { flex:1; }
    #status { min-height:1.6em; margin-top:16px; overflow-wrap:anywhere; }
    @media (max-width:440px) { body { padding:16px; } main { padding:24px 20px; } h1 { font-size:22px; } }
  </style>
</head>
<body>
  <main>
  <header><h1>登录织贸</h1>
  <p id="login-intro">使用企业提供的域名或公网 IP 和织贸内部账号登录。</p></header>
  <form id="connect-form">
    <div id="password-step" class="fields"><div><label for="server-origin">域名或公网 IP</label>
    <input id="server-origin" type="text" autocomplete="off" spellcheck="false" placeholder="trade.example.com 或 203.0.113.10:8443" aria-describedby="login-intro" required></div>
    <div><label for="username">织贸内部账号</label>
    <input id="username" autocomplete="off" maxlength="150" required></div>
    <div><label for="password">密码</label>
    <input id="password" type="password" autocomplete="off" required></div>
    </div>
    <div id="email-step" hidden><p id="email-hint">验证码已发送至管理员绑定的邮箱，5 分钟内有效。</p><label for="email-code">邮箱验证码</label><input id="email-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" aria-describedby="email-hint"><div class="secondary-actions"><button id="resend-code" type="button">重新发送验证码</button><button id="restart-login" type="button">返回账号密码</button></div></div>
    <button id="login-button" type="submit">登录</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
