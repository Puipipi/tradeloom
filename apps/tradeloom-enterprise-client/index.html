<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>连接企业服务器 - TradeLoom</title>
  <style>
    body { margin: 0; padding: 28px; color: #e7edf5; background: #111820; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { color: #aebdcb; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; color: #aebdcb; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; color: inherit; background: #1c2732; border: 1px solid #46596b; border-radius: 6px; font: inherit; }
    button { margin-top: 14px; padding: 9px 16px; color: white; background: #3478c7; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <h1>连接企业服务器</h1>
  <p>输入企业提供的 HTTPS 服务器地址。登录账号由服务器验证；此客户端只记住服务器地址。</p>
  <form id="connect-form">
    <label for="server-origin">服务器地址</label>
    <input id="server-origin" type="url" autocomplete="url" spellcheck="false" placeholder="https://trade.example.com" required>
    <button type="submit">连接</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="renderer.js"></script>
</body>
</html>
